<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset><legend>Registration Form</legend>
        <form action="#">
            <label for="FullName">Full Name:</label>
            <input type="text" id="FullName" Placeholder="Enter Full Name">
            <br><br>

          <label><b><span style="color:red;">*</span></b>Email:</label>
           <input type="email"  required>
           <br><br>


           <label>Contact: </label>
           <input type="tel">
           <br><br>

           <label>Password: </label>
           <input type="Password">
           <br><br>

           <label>Gender:</label>
           <input type="radio" name="Gender">Male
           <input type="radio" name="Gender">Female
           <br><br>

           <label>City:</label>
           <select name="city">
             <option></option>
             <option value="Mumbai">Ahmedabad</option>
             <option >Pune</option>
             <option>Hadpsar</option>
           </select>
           <br><br>

           <label>Address:</label>
           <textarea name="Address" rows="5" cols="5"></textarea>
           <br><br>

           <label>sign</label>
           <input type="file" name="sign">
           <br><br>
           <button>Submit</button>


         </form>
    </fieldset>
</body>
</html>
