<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Shedule</title>
</head>
<body>
    <table rules="all" border="2px" cellpadding="10" cellspacing="10" allign="Center">
        <tr>
            <th><mark><big><u>Time</u></big></mark></th>
            <th><mark><big><u>Task</u></big></mark></th>
            <th><mark><big><u>Place</u></big></mark></th>
            <th><mark><big><u>Status</u></big></mark></th>
        </tr>

        <tr>
            <td>7 AM</td>
            <td>Wake Up</td>
            <td>Home</td>
            <td>Done</td>
        </tr>

        <tr>
            <td>8 AM</td>
            <td>Breakfast</td>
            <td>Home</td>
            <td>Done</td>
        </tr>

        <tr>
            <td>9.30 AM</td>
            <td>Go To Institude</td>
            <td>Institude</td>
            <td>Done</td>
        </tr>

        <tr>
            <td>10-11 AM</td>
            <td>Lunch</td>
            <td>Home</td>
            <td>Done</td>
        </tr>

        <tr>
            <td>11 to 4</td>
            <td>Study</td>
            <td>Lecture</td>
            <td>Pending</td>
        </tr>

        <tr>
            <td>8-9 PM</td>
            <td>Dinner</td>
            <td>Home</td>
            <td>Pending</td>
        </tr>
    </table>
</body>
</html>
