<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Selector</title>
    <link rel="stylesheet" href="./selector.css">
</head>
<body>
    <p>Gujarat</p>

    <p id="p93">Maharastra</p>

    <p>Rajasthan</p>
    <br><br>

    <h2 class="H23">Python</h2>

    <h2 class="H23">JAVA</h2>

    <h2 class="H23">PHP</h2>
    <br><br>

    <div>
        <p>Pune</p>
        <h3><b><p>Jalgaon</p></b></h3>
        <p>Mumbai</p>
        <p>Nashik</p>
    </div>
    <br><br>

    <p>Maharastra</p>
    <p>Gujarat</p>
    <p>Rajasthan</p>

    <!--Pseudo class selector-->
    <a href="#">Click Hear</a>
    <button>Hello</button>
    
    <label for="FullName"></label>
    <input type="text" placeholder="Enter Name">

    <a href="https://www.flipkart.com/">Flipcard</a>

    <a href="https://www.google.com/">Google</a>

    <ol>
        <li>Apple</li>
        <li>Mango</li>
        <!--li>Grapes</li-->
        <li>Orange</li>
    </ol>

       <!--Pseudo element selector-->
    
    <p class="p55">HTML</p>
    <p>CSS</p>
    <p>JAVASCRIPT</p>
    <h2>Welcome to Fortune Cloud Technologies</h2>
</body>
</html>
